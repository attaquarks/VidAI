services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 6

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 12

  ai-service:
    build: ./ai-service
    restart: unless-stopped
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      MONGODB_URI: mongodb://mongo:27017/vidai
      DB_NAME: vidai
      CORS_ORIGINS: http://localhost:3000,http://localhost:8080
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
    depends_on:
      mongo:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 6

  backend:
    build: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/vidai
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-too}
      CLIENT_URL: http://localhost:8080,http://localhost:3000
      AI_SERVICE_URL: http://ai-service:8000
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@vidai.pk}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
    depends_on:
      mongo:
        condition: service_healthy
      ai-service:
        condition: service_started
    volumes:
      - uploads:/app/uploads

  frontend:
    build: .
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongo-data:
  ollama-models:
  uploads:
